# Every 5 minutes: read the four MST ChargePoint ports and send the reading to the app.
# A public repo, so GitHub Actions minutes are free. Nothing secret here: the app trusts the
# run through GitHub's OIDC token (id-token: write), which names this repository.
name: check
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write   # only for the monthly keep-alive below
  id-token: write
concurrency:
  group: check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Read the ports and send them to the app
        run: node check.mjs
      # GitHub turns off schedules in public repos after 60 days without a commit, so once a
      # month this records the date in keepalive.txt.
      - name: Keep the schedule alive
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 86400 )) ]; then
            date -u +%FT%TZ > keepalive.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git add keepalive.txt
            git commit -m "Keep the check schedule alive"
            git push
          fi
